# M-01 | 채팅 세션 스와이프 삭제 (모바일)
#
# 전제: 로그인 상태, 채팅 세션 1개 이상 존재
# 스텝:
#   1. 홈 → 건강상담 탭 진입
#   2. 세션 목록 로드 확인
#   3. 첫 번째 세션 행을 왼쪽으로 스와이프
#   4. "삭제" 액션 버튼 나타남 확인
#   5. 삭제 버튼 탭 → 확인 다이얼로그 승인
#   6. 해당 세션이 목록에서 제거됨 확인
# 기대:
#   - 스와이프 후 빨간 "삭제" 버튼 노출
#   - 삭제 후 세션 행 사라짐 (토스트 or 빈 상태)

appId: host.exp.exponent
---
- runFlow: _login.yaml

# Step 1: 건강상담 탭 진입
- tapOn:
    text: "건강상담"
- waitForAnimationToEnd

# Step 2: 세션 목록 로드 확인
- assertVisible:
    text: "새 상담"

# 세션이 없으면 하나 생성
- runFlow:
    when:
      visible:
        text: "새 상담을 시작해보세요"
    file: _create_chat_session.yaml

# Step 3: 첫 번째 세션 행 왼쪽 스와이프
- swipe:
    direction: LEFT
    element:
      index: 0
      below:
        text: "상담 목록"
- waitForAnimationToEnd

# Step 4: 삭제 액션 버튼 확인
- assertVisible: "삭제"

# Step 5: 삭제 버튼 탭
- tapOn: "삭제"
- waitForAnimationToEnd

# 확인 다이얼로그 처리 (Alert.alert)
- tapOn:
    text: "삭제"
    optional: true
- waitForAnimationToEnd

# Step 6: 세션 제거 확인
- assertTrue:
    visible:
      text: "새 상담을 시작해보세요"
  OR:
    - assertNotVisible:
        text: "삭제 테스트용"
