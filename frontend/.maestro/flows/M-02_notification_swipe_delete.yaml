# M-02 | 알림 스와이프 삭제 (모바일)
#
# 전제: 로그인 상태, 알림 1개 이상 존재
# 스텝:
#   1. 홈 화면 상단 벨 버튼 탭 → 알림 드로어 열림
#   2. 알림 목록 로드 확인 (없으면 빈 상태 검증 후 종료)
#   3. 첫 번째 알림 행을 왼쪽으로 스와이프
#   4. 빨간 "삭제" 버튼 노출 확인
#   5. 삭제 버튼 탭 → 해당 알림 행 사라짐 확인
#   6. "알림을 모두 지웠어요" 토스트 (전체 삭제 시) or 행 수 감소 확인
# 기대:
#   - 스와이프 후 삭제 액션 노출
#   - 탭 후 해당 알림 즉시 제거
#   - 전체 삭제 시 빈 상태 표시

appId: host.exp.exponent
---
- runFlow: _login.yaml

# Step 1: 벨 버튼 탭 → 드로어 열기
- tapOn:
    accessibilityLabel: "알림"
- waitForAnimationToEnd

# Step 2: 드로어 열림 확인
- assertVisible: "알림"

# 알림 없으면 빈 상태 확인 후 종료
- runFlow:
    when:
      visible:
        text: "알림이 없어요"
    commands:
      - assertVisible: "알림이 없어요"
      - stopFlow

# Step 3: 첫 번째 알림 행 왼쪽 스와이프
- swipe:
    direction: LEFT
    element:
      index: 0
      below:
        text: "알림"
- waitForAnimationToEnd

# Step 4: 삭제 버튼 확인
- assertVisible: "삭제"

# Step 5: 삭제 버튼 탭
- tapOn: "삭제"
- waitForAnimationToEnd

# Step 6: 알림 제거 확인
- assertTrue:
    visible:
      text: "알림이 없어요"
  OR:
    - assertNotVisible:
        text: "삭제"  # 삭제 액션 버튼이 더 이상 없음
