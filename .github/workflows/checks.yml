name: ci.yml

on:
  push:
    branches:
      - main
      - develop
      - 'release/*'
      - 'hotfix/*'
  pull_request:
    branches:
      - main
      - develop
      - 'release/*'
      - 'hotfix/*'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff Check (Linting)
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format . --check

  test:
    runs-on: ubuntu-latest
    env:
      MFDS_API_KEY: ci-dummy-key-not-used-in-tests
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: ozcoding
      DB_PASSWORD: pw1234
      DB_NAME: ai_health
      OPENAI_API_KEY: ci-dummy-key-not-used-in-tests
    services:
      postgresql:
        image: postgres:16
        env:
          POSTGRES_USER: ozcoding
          POSTGRES_PASSWORD: pw1234
          POSTGRES_DB: ai_health
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ozcoding"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --group app --frozen

      - name: Check if tests exist
        id: check_tests
        run: |
          if [ -d "tests" ] || [ $(find . -name "test_*.py" | wc -l) -gt 0 ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Create ozcoding default database
        run: |
          PGPASSWORD=pw1234 psql -h 127.0.0.1 -U ozcoding -d ai_health -c "CREATE DATABASE ozcoding;"
      - name: Run Tests with Coverage
        if: steps.check_tests.outputs.has_tests == 'true'
        env:
          DATABASE_URL: postgres://ozcoding:pw1234@127.0.0.1:5432/ai_health
        run: |
          uv run coverage run -m pytest app
          uv run coverage report -m