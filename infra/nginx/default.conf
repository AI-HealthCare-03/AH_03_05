map $http_origin $cors_origin {
    default "";
    "http://localhost:8081"  "http://localhost:8081";
    "http://localhost:8082"  "http://localhost:8082";
    "http://localhost:3000"  "http://localhost:3000";
    "http://localhost:19006" "http://localhost:19006";
}

upstream fastapi {
    server fastapi:8000;
}

server {
    server_name medipt05.store www.medipt05.store;
    listen 80;
    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    server_name medipt05.store www.medipt05.store;
    listen 443 ssl;
    client_max_body_size 10m;

    ssl_certificate /etc/letsencrypt/live/medipt05.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medipt05.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            return 204;
        }

        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept" always;

        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
    }

    location / {
        root /vol/web/frontend;
        try_files $uri $uri/ /index.html;
    }
}